[project]
name = "pympcc"
version = "0.5.0"
description = "Python solver for Mathematical Programs with Complementarity Constraints (MPCC) using IPOPT via cyipopt"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "David Villacis" },
]
keywords = [
    "mpcc", "mpec", "complementarity", "optimization",
    "ipopt", "nonlinear-programming", "bilevel-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/dvillacis/pympcc"
"Bug Tracker" = "https://github.com/dvillacis/pympcc/issues"
Changelog = "https://github.com/dvillacis/pympcc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "cython>=3.2.4",
    "cyipopt>=1.3",
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
]
numba = ["numba>=0.57"]
jax = ["jax>=0.4"]
scipy = ["scipy>=1.10"]
pyomo = ["pyomo>=6.7"]
docs = [
    "sphinx>=7.3",
    "myst-nb>=1.1",
    "furo>=2024.5",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["pympcc"]

[tool.hatchling.build.targets.sdist]
exclude = [
    ".coverage",
    ".coverage.*",
    "htmlcov/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".mypy_cache/",
    "build/",
    "CLAUDE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
minversion = "7.0"

[tool.coverage.run]
omit = [
    "pympcc/_scipy_adapter.py",
    "pympcc/_jax.py",
    "pympcc/benchmarks/macmpec.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — handled by black/formatter
    "E741",   # ambiguous variable name (l, O, I) — used legitimately in math code
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_reexport = false

[dependency-groups]
dev = [
    "cython>=3.2.4",
]
