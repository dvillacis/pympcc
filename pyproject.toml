[project]
name = "pympcc"
version = "0.1.0"
description = "Python solver for Mathematical Programs with Complementarity Constraints (MPCC) using IPOPT via cyipopt"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "David Villacis" },
]
keywords = [
    "mpcc", "mpec", "complementarity", "optimization",
    "ipopt", "nonlinear-programming", "bilevel-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
    "cyipopt>=1.3",
]

[project.urls]
Repository = "https://github.com/davidvillacis/pympcc"
"Bug Tracker" = "https://github.com/davidvillacis/pympcc/issues"
Changelog = "https://github.com/davidvillacis/pympcc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
numba = ["numba>=0.57"]
jax = ["jax>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
